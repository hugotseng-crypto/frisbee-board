<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飞盘战术板</title>
<style>
  :root { --bg:#0e1c12; --panel:#132418; --line:#e8f5e9; --o:#ff9f0a; --b:#0a84ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif; background:var(--bg); color:#eef8ef; min-height:100vh; }
  header { padding:14px 16px 8px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  h1 { font-size:18px; letter-spacing:.08em; }
  .wrap { display:grid; grid-template-columns: 1fr 280px; gap:12px; padding:0 12px 16px; }
  @media (max-width:860px) { .wrap { grid-template-columns:1fr; } }
  canvas { width:100%; background:#14733a; border-radius:16px; display:block; touch-action:none; }
  aside { background:var(--panel); border-radius:16px; padding:14px; }
  label { display:block; font-size:12px; opacity:.7; margin:10px 0 6px; }
  button, select { width:100%; border:0; border-radius:10px; padding:10px; font:inherit; font-weight:700; margin-bottom:8px; }
  button { background:#1e3d28; color:#eef8ef; }
  button.pri { background:#34c759; color:#06210d; }
  button.warn { background:#3a2018; color:#ffd0c8; }
  .hint { font-size:12px; line-height:1.5; color:#b7d0bc; }
</style>
</head>
<body>
<header>
  <h1>飞盘战术板</h1>
  <div class="hint">给社课拆战术用 · 拖球员 · 点选后再点场地点路线</div>
</header>
<div class="wrap">
  <canvas id="c"></canvas>
  <aside>
    <label>阵型</label>
    <select id="form">
      <option value="vert">Vertical stack 纵向</option>
      <option value="hoz">Horizontal stack 横向</option>
      <option value="iso">Isolation 单边 iso</option>
      <option value="split">Split stack</option>
    </select>
    <button class="pri" id="reset">套用阵型</button>
    <button id="play">播放跑位</button>
    <button id="stop">停止</button>
    <button id="clear">清除路线</button>
    <button class="warn" id="undo">撤销路线点</button>
    <p class="hint" id="info">点一名进攻球员（橙），再在场上连续点击画出切跑。蓝方是防守。</p>
  </aside>
</div>
<script src="board.js"></script>
</body>
</html>
